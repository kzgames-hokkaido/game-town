<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新コーナー</title>
<style>
:root{--bg:#0d1226;--panel:#151c38;--line:rgba(255,255,255,.12);--text:#eef2fb;--sub:#a9b4d0;--accent:#ffe14d;--new:#ff5a7a;--game:#4fc3f7;--fix:#7bd88f;--look:#c792ea;--move:#ffb74d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d2752 0%,var(--bg) 60%);color:var(--text);font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;min-height:100vh}
header{padding:28px 16px 10px;text-align:center}
header small{display:block;color:var(--sub);letter-spacing:.3em;font-size:13px}
header h1{margin:4px 0 6px;font-size:40px;letter-spacing:.08em}
header h1 .neon{color:var(--accent);text-shadow:0 0 12px rgba(255,225,77,.6)}
header p{margin:0;color:var(--sub)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.tabs button{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
section{display:none}
section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.day{margin:22px 0 6px;color:var(--accent);font-weight:800;font-size:18px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.tag{flex:none;font-size:12px;font-weight:800;border-radius:6px;padding:3px 7px;color:#0d1226;margin-top:2px}
.tag.game{background:var(--game)}.tag.new{background:#80deea}.tag.chg{background:#ff8a65}.tag.fix{background:var(--fix)}.tag.look{background:var(--look)}.tag.move{background:var(--move)}.tag.town{background:var(--accent)}
.newb{flex:none;font-size:11px;font-weight:900;color:#fff;background:var(--new);border-radius:6px;padding:2px 6px;margin-top:3px}
.txt b{color:#fff}
.timeline .row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline .row:last-child{border-bottom:none}
.no{font-size:22px;font-weight:900;color:var(--accent);text-align:center}
.nm{font-weight:800;font-size:17px}
.dt{color:var(--sub);font-size:13px}
.play{background:#2b6fd6;color:#fff;border:none;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;text-decoration:none;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin:6px 0 4px}
.legend span{display:flex;gap:5px;align-items:center}
.back{display:block;width:max-content;margin:26px auto 0;background:#e8eef8;color:#13233a;border-radius:12px;padding:12px 26px;font-weight:800;text-decoration:none}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--accent)}
@media (max-width:520px){header h1{font-size:30px}.timeline .row{grid-template-columns:40px 1fr}.timeline .play{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header>
  <small>さいしん コーナー</small>
  <h1><span class="neon">最新</span>コーナー</h1>
  <p>新しいゲームや、変わったところのお知らせ</p>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="on" data-tab="news">最新のお知らせ</button>
    <button data-tab="order">ゲームができた順番</button>
    <button data-tab="info">いろいろ</button>
  </div>

  <section id="news" class="on">
    <div class="legend"><span><i class="tag game">新しいゲーム</i></span><span><i class="tag new">新しい</i></span><span><i class="tag chg">変わった</i></span><span><i class="tag move">新しい動き</i></span><span><i class="tag look">見た目</i></span><span><i class="tag fix">直した</i></span><span><i class="tag town">街</i></span><span><i class="newb">NEW</i>前に来たときより後のお知らせ</span></div>
    <div id="newsList"></div>
  </section>

  <section id="order">
    <div class="card timeline" id="orderList"></div>
  </section>

  <section id="info">
    <div class="stat" id="stats"></div>
    <div class="card" id="infoText"></div>
  </section>

  <a class="back" href="街.html">街へもどる</a>
</div>

<script>
/* ===== 最新コーナーのデータ =====
   新しいゲーム・NPC・見た目(スキン)の変更・新しい動きができたら、ここに足す (新しいものを上に)。
   ひみつの仕かけ (にせのゴールなど) は書かない。 */
const NEWS = [
  { d: '2026-11-08', items: [
    ['chg', 'L字マンション鬼ごっこ（Bパターン）：6番・7番（青いジャージ）・8番（金髪の仲間）の鬼との戦い方が変わった。6番は3階の西通路のかげにかくれ、7番は2階の中央階段で待ち、8番が鬼をさそって3階の中央階段まで連れてくる。鬼が下りてきたら6番が<b>消火器</b>をふき出して目をくらまし、上の柄のセーターをぬいで（下は白い長そでのボタンつきシャツ）投げる。鬼はセーターをうちまくって<b>弾を打ちつくす</b>。弾を入れかえているあいだに7番が<b>エレベーター</b>で3階へ上がってきてとびかかるが、失敗してうたれる。そのあとは今までどおり。'],
    ['chg', 'L字マンション鬼ごっこ（Bパターン）：鬼をさそう前に準備をととのえる。各階のエレベーターの前（南側のかべぞい）に<b>横に長い背もたれのないいす</b>ができて、6番は作戦を言うまで3階のいすにひざを曲げてすわっている。作戦のあと6番は<b>2階の中央階段の踊り場より上</b>にかくれ、7番は鬼が来る前に<b>2階のエレベーターを呼んでおいて</b>扉の前で待つ（合図でそのまま乗る）。鬼は8番を見つけるとうちまくるが当たらず、消火器の<b>けむりは中央階段の部屋じゅうに充満</b>し、鬼はけむりの中へうちまくる。6番がぬいで投げる服は<b>服の形でひらひら落ちて</b>床に広がり、鬼はそれをうって弾を打ちつくす。'],
    ['chg', '観戦モード（幽霊モード）のあるゲームぜんぶ：やられたら<b>自分の倒れた体がその場に残る</b>（こわい表現オフでも自分の体は消えない）。クリアしてから観戦になるゲーム（ビル・鉄骨渡り・実験ゲーム・空中ケンパ・ドローンレーザー・缶蹴り・熱湯スタジアム崩壊）では、<b>クリアした自分がその場に立ったまま</b>見える。ロープ・実験ゲーム・空中ケンパ・人生のレールで落ちた体は、いちばん下で止まって横たわり、幽霊はそこまで降りて見られる。'],
    ['chg', 'ドリル戦車：町の歩道に<b>見回りの警察官6人</b>（北側の歩道に3人・南側の歩道に3人、はなれて並ぶ）がずっと歩いている。歩道のはしで折り返す。30秒ごとに交番から出ていた見回りはやめた。'],
    ['chg', 'L字マンション鬼ごっこ（Bパターン）：参加者をBパターン専用の<b>新しい10人</b>に作り直し（ほかのゲームの人の着せかえではない）、見た目を<b>元になったまんがの鬼ごっこの参加者と同じような見た目</b>にした（若い男2人・中折れ帽のはげた年配の男・柄の服の女の人・地元の男・日焼けの中年・元レスラーのコーチ・走る格好の女の子・白いパーカーの人・金色の坊主の人。鬼は<b>馬のかぶりもの</b>に白いタンクトップと灰色のコート）。やられる順番は 1・2番 → 3番 → 4番 → 5番（地雷）→ 7番 → 6番。<b>あなたがやられても</b>、幽霊モードで残った人たちは流れどおりに動く（ただしゴールはできず、時間切れで爆破される）。'],
  ] },
  { d: '2026-11-07', items: [
    ['fix', 'ドリル戦車：スーパーの自動ドアが建物の角からはみ出していたのを直した（入口は建物の中におさめて、ガラスは左のかべの中へすべる。真ん中に立っても開く）。<b>車モードでは警察官が追ってこない</b>（店の中を見回るだけ）。'],
    ['chg', 'ドリル戦車：飲食店3軒にカウンターの<b>席が5つ</b>。<b>30秒に1人</b>、歩いている住民がどこかの店に入って食べる（1軒に4人まで）。あなたも<b>E</b>で注文できる（<b>タダ</b>。お金はいらない）。ラーメン・寿司・カツ丼はちゃんとした見た目で大きく出てきて、食べると中身だけ減っていく（皿は残る）。店の客も、はしを口に運ぶ動きで<b>ちゃんと食べる</b>（一口ごとに減る）。'],
    ['chg', 'ドリル戦車（車モード）：<b>E</b>で<b>車から降りられる</b>（止まっているとき）。歩いて店や町を回れて、車の近くでEでまた乗る。'],
    ['chg', 'ドリル戦車（車モード）：ほかの車につっこむと<b>交通事故</b>になる。ぶつけられた車は止まってけむりを出し、<b>20秒後に爆発</b>して近くにいた人は死ぬ（あなたは死なない）。事故で警察の車が2台に。'],
    ['chg', 'ドリル戦車：信号を<b>赤・黄・青</b>の3つにして、ついている色だけ光るようにした。人は車の信号が赤のときだけ横断歩道を渡る。<b>30秒に1回</b>、交番から警察官が歩いて見回りに出る。スーパーの入口を広くして自動ドアを2組にした（事件のときに警察が入口でつっかかっていた）。つっかかった人は横によける。'],
    ['chg', 'ドリル戦車：<b>警察の車</b>は交番から出てきて、いつも1台が道を見回りしている（道のはしで折り返す）。車モードで事故（つっこむ・倒壊）を起こすと<b>2台</b>になる。'],
    ['chg', 'みらいモール・街：スキンの「服の色」「ズボンの色」に、地下（鉄骨渡り第一ゾーン）で借金を返している人たちの<b>作業服の色8色</b>を足した。'],
    ['chg', 'ドリル戦車（車モード）：人をひくと<b>血が出る</b>（こわい表現の設定で量がかわる）。ビルや飲食店は<b>3回つっこむと倒壊</b>する（地面にしずんで、がれきだけ残る。中にいた人は死亡）。'],
    ['fix', 'ドリル戦車（車モード）：ビルや店につっこむと<b>壁がくずれて</b>がれきが飛び、壁に穴とひびが残る。ひいた人は近くに倒れて<b>死体が残る</b>（店の中まで飛んでいた）。事故のあと<b>バックでもどれる</b>ようになった（前は動けなくなった）。'],
    ['new', 'ドリル戦車：<b>車モード</b>ができた（タイトルで選ぶ）。外の道の車を運転して（W加速・Sブレーキ／バック・A/Dハンドル・V視点）、歩道や店の中に乗り入れて<b>人をひく</b>。<b>店やビルにつっこむと事故</b>で、中にいる人が死ぬ。時々<b>警察の車</b>が見回りに来る。車モードだけ、スーパーの客は会計がすむと帰る。'],
    ['chg', 'ドリル戦車：町に<b>車が走る</b>ようになった（信号と横断歩道つき。赤信号で車が止まり、人は青で渡る。ふつうは自分もNPCもひかれない）。歩道を歩く<b>住民30人</b>。飲食店の客は帰ったり新しく来たりする。<b>飲食店や外での殺人</b>は、スーパーの人は出ずに<b>交番から警察6人</b>と<b>住民9人</b>が来る。店を出た客や警察官は消えずに外の歩道にいて、終わるともどってくる。客は<b>かごを持たない</b>。住民の服の色は地下の人と同じ。'],
    ['new', 'ドリル戦車：スーパーの外に<b>町</b>ができた。道路と歩道、まわりのビル。入れる建物は<b>飲食店</b>だけで、<b>ラーメン高一</b>（ラーメン屋）・<b>寿司屋良口</b>（寿司屋）・<b>カツ勝</b>（カツ丼屋）の3軒（ドアを開けて入る。中にはカウンター、店の人、食べている客）。<b>交番</b>の前には<b>指名手配のポスター</b>が3人分。<b>1人殺して20秒たつと、あなたのポスターも加わる</b>（やり直すと消える）。'],
    ['fix', 'ドリル戦車：いったん店を出て「もう一回」したとき、事件のテープやコーンが残っていたのを直した。'],
  ] },
  { d: '2026-11-05', items: [
    ['fix', 'ドリル戦車：はじめから客が同じ場所に出なくなった（会計は1レジ1人、棚の前は別々の場所）。近すぎる人どうしは押し合ってはなれるので、重ならない。'],
    ['fix', 'ドリル戦車：レジの列の客が重なっていたのを直した。来た順に1人ずつ間をあけてならび、前の人が会計に行くとつめる。'],
    ['chg', 'ドリル戦車（暗殺者モード）：殺したときの「だれかに見られた」の表示をなくした。事件のときの「○○が目撃した！ 警察を呼んだ」は出る。店員でも警察官でも客でも、見た人が通報する。'],
    ['chg', 'ドリル戦車（暗殺者モード）：殺されたのが店員でも客でも警察官でも、列にならんでいても、<b>その人に一番近くにいた人が必ず目撃</b>して警察を呼ぶ（関係者以外立入禁止の裏部屋の中だけはバレない）。'],
    ['chg', '鉄骨渡り 第一ゾーン（地下）とドリル戦車：地下の人とスーパーの客のかみ型を<b>七三とツンツンだけ</b>にした。'],
    ['fix', 'ドリル戦車（事件）：棚のあいだで殺しても、7メートル以内の客は棚ごしでも気づいて事件がはじまる（前はレジの列の客しか気づかなかった）。'],
    ['chg', 'ドリル戦車（事件）：捜査中に、かごを持っていない客が<b>9人、現場を見に来る</b>（テープの外に立って見ている）。捜査は70秒。警察が急いで来るようになり、レジの前で事件が起きてもレジに引っかからない。目撃者は四角の角ではなく辺のところに立つ。'],
    ['fix', 'ドリル戦車：レジの店員は客のほうを向き、会計中の客はレジのほうを向くようになった（逆だった）。レジの番号の看板も客がわから読める向きにした。事件のときに残る店員は<b>2人だけ</b>（ほかの店員も店から出る）。'],
    ['chg', 'ドリル戦車（暗殺者モード）：事件のとき、まず客が<b>走って出ていき</b>、目撃者の客1人と店員だけが残った状態になってから警察の捜査がはじまる。証拠のコーンは、4つの面に大きな数字がついて、裏からも読める。事件のときは警察官も店から出ていき、捜査する警察官6人が入口から入ってくる。客のスキンは地下の人と同じシンプルなもの（七三・短髪・つんつん、地味な服）にした。事件は<b>1回だけ</b>起きて、2回目からは無視される。'],
    ['new', 'ドリル戦車（暗殺者モード）：<b>客の目の前で殺すと事件になる</b>。客が警察を呼び、客は全員店から帰って、店員2人と目撃した客だけが残って事情を説明する。警察官6人が現場に来て、黄色いテープを張り、しゃがんで調べたり歩き回ったりする（まぢかで見られる）。45秒ほどで<b>結局、事故ということで捜査は終わり</b>、客がもどってきて再開する。タイトルで<b>「見られたら追ってくる」警察</b>も選べる（追ってくるだけで失格はない）。'],
    ['chg', 'ドリル戦車：入口に<b>自動ドア</b>（ガラスが左右に開く）、裏部屋に<b>開くドア</b>がついた（人が近づくと開く）。暗殺者モードは、<b>F</b>で近くの人ならだれでも（客・店員・警察官）誘えるようになった。警察官は誘われたときだけついてきて、目の前で殺人が起きても追ってこない。三人称視点の向きも直した。'],
    ['new', 'ドリル戦車：<b>暗殺者モード</b>ができた（タイトルで選ぶ）。戦車に乗らずに歩いて、<b>E</b>で目の前の人を<b>一発で倒す</b>。<b>F</b>で近くの人を<b>誘う</b>（ついてくる）と、北西のすみの<b>関係者以外立入禁止の裏部屋</b>で倒せばだれにも見られない。失格はない。Qで店を出ると暗殺した人数が出る。'],
    ['chg', 'ドリル戦車：棚が倒れるのは<b>7回ぶつかったとき</b>になった（吹っ飛んだ人だけでなく、戦車の体当たりも数える）。'],
    ['chg', 'ドリル戦車：<b>リアルな仕かけ</b>が増えた。棚にぶつかると<b>商品が散らばる</b>。吹っ飛んだ人が棚にぶつかっても散らばり、<b>7人ぶつかると棚が倒れる</b>（ドミノみたいにはならない）。壁にぶつかると画面がゆれる。吹っ飛んだ人が<b>レジやセルフレジに当たると感電</b>。<b>ウォーターサーバー</b>（3つ）がこわれると水が広がり、レジの<b>コードに水がつくと水の中の人が感電</b>する。Rのリロードで全部元にもどる。'],
    ['chg', 'ドリル戦車：客は<b>1分に1回、30人くらいがレジのほうに集まる</b>。レジの列にならんで会計をすませると、また買い物にもどる。'],
    ['chg', 'ドリル戦車：死んだ人は目が<b>バツ</b>になる。血は<b>リロードするまで残る</b>（こわい表現「ひかえめ」は小さめ、「ちょいグロ」は大きめ、「なし」は血なし）。'],
    ['chg', 'ドリル戦車：動かし方を<b>ほかのゲームと同じ</b>にした（WASDで前後左右、マウスで見回す、シフトでダッシュ）。<b>Vで三人称視点</b>に切りかえられる。<b>Rで<b>リロード</b></b>（NPCが全員もどって、死体が消える）。客は会計のあと店から帰らずに、また買い物をする。'],
    ['game', '<b>新ゲーム「ドリル戦車」</b>（AI地点）：横70メートルのめっちゃ広いスーパー（棚がたくさん。レジの近くは棚なし）。あなたは<b>ドリルつきの小さな戦車</b>に乗って（一人称）、<b>警察官100人</b>・<b>レジの店員10人</b>（セルフレジをふくめて7か所）・<b>客50人</b>（商品をかごに入れている人も、レジで会計中の人もいる）を吹っ飛ばす。吹っ飛んだ人は<b>倒れる</b>。同じ人を2回吹っ飛ばすと死んで、<b>死体はそのまま残る</b>（代わりの人は来ない。Rのリロードで全員もどる）。視点の高さは人と同じ。警察官は前のほうから追ってくる。客と店員は気づくと逃げるがおそい。クリアも制限時間も失格もない。こわい表現は切りかえ式。'],

<!-- ===== コントローラー (プロコンなど) でも操作できる。キーボードとマウスの操作はそのまま ===== -->
<style>
.gp-focus{outline:4px solid #ffd400!important;outline-offset:3px!important;box-shadow:0 0 0 8px rgba(255,212,0,.35)!important}
#gpHelp{position:fixed;right:10px;bottom:10px;z-index:99999;background:rgba(10,14,24,.9);color:#fff;font:12px/1.55 "BIZ UDPGothic","Hiragino Sans",sans-serif;padding:10px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.25);pointer-events:none;display:none;max-width:275px;text-align:left}
#gpHelp b{color:#ffd400}
#gpToast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;background:rgba(10,14,24,.9);color:#fff;font:bold 15px "BIZ UDPGothic",sans-serif;padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .4s}
</style>
<div id="gpHelp"><b>コントローラーの操作</b><br>
左スティック：移動（スティックを押しこむ か ZL：走る）<br>
右スティック：見回す<br>
B：スペース（ジャンプ）　A：E<br>
Y：Q　X：C（かがむ）<br>
R：F　L：R　ZR：マウスのクリック<br>
＋：ポーズ　－：M<br>
十字キー：← 1　↑ 2　→ 3　↓ エンター<br>
メニューでは、十字キーで選んで <b>A で決定</b>、B でもどる</div>
<div id="gpToast"></div>
<script>
(() => {
  const DEAD = .18, STICK = .45, LOOK_X = 2.6, LOOK_Y = 1.9;   /* 右スティックをいっぱいに倒すと、1秒で約150°回る */
  const held = {};   /* コントローラーが押しているキー */
  let blocked = {}, wasMenu = false, used = false, zrOn = false, helpT = 0, focus = null, prev = [], navHold = '', navT = 0, last = performance.now(), toastT = 0, dragOn = false, vx = innerWidth / 2, vy = innerHeight / 2;
  const $h = document.getElementById('gpHelp'), $t = document.getElementById('gpToast');
  const keyName = c => c.startsWith('Key') ? c.slice(3).toLowerCase() : c.startsWith('Digit') ? c.slice(5) : c === 'Space' ? ' ' : c === 'ShiftLeft' ? 'Shift' : c;
  function key(code, down){ if (!!held[code] === down) return; held[code] = down; document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, key: keyName(code), bubbles: true, cancelable: true })); }
  const tap = code => { key(code, true); setTimeout(() => key(code, false), 60); };
  const releaseAll = () => { for (const c in held) if (held[c]) key(c, false); if (dragOn) endDrag(); if (zrOn){ zrOn = false; mouse('mouseup', 0); } };
  const cv = () => document.querySelector('canvas') || document.body;
  function mouse(type, button){ cv().dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button, buttons: type === 'mouseup' || type === 'click' ? 0 : button === 2 ? 2 : 1, clientX: vx, clientY: vy, view: window })); }
  const DRAGGAME = $h.dataset.mode === 'drag';   /* てんびん: 画面をドラッグして見回すゲーム */
  function startUsing(){ if (used) return; used = true; /* マウスを画面に閉じこめない遊び方にする (ゲームに「閉じこめられなかった」と知らせる) */ if (!document.pointerLockElement) document.dispatchEvent(new Event('pointerlockerror')); }
  function endDrag(){ dragOn = false; cv().dispatchEvent(new MouseEvent('mouseup', { bubbles: true, button: 0, buttons: 0, clientX: vx, clientY: vy })); }
  function toast(t){ $t.textContent = t; $t.style.opacity = 1; toastT = 3; }
  addEventListener('gamepadconnected', () => { toast('コントローラーがつながりました'); helpT = 8; });
  addEventListener('gamepaddisconnected', () => { releaseAll(); toast('コントローラーがはずれました'); });

  // ---------- メニュー (タイトル・ポーズ・終わりの画面) のボタン選び ----------
  const SEL = 'button, a[href], .opt, select, [onclick], [data-gp]';
  const inScroller = el => { for (let p = el.parentElement; p && p !== document.body; p = p.parentElement){ const o = getComputedStyle(p).overflowY; if ((o === 'auto' || o === 'scroll') && p.scrollHeight > p.clientHeight + 4){ const r = p.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; } } return false; };
  const scrollable = () => document.documentElement.scrollHeight > innerHeight + 4;
  /* ゲームの画面では、タイトル・ポーズ・終わりなどの「画面いっぱいのメニュー」の中のボタンだけを選ぶ (ゲーム中に出ているボタンで歩けなくならないように) */
  const menuSel = () => !document.querySelector('canvas') || $h.dataset.menu === 'all' ? null : '.screen' + ($h.dataset.menu ? ', ' + $h.dataset.menu : '');
  function clickables(){
    const out = [], ms = menuSel();
    for (const el of document.querySelectorAll(SEL)){
      if (el.disabled || el.closest('#gpHelp') || (ms && !el.closest(ms))) continue; const r = el.getBoundingClientRect(); if (r.width < 4 || r.height < 4) continue;
      const on = r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
      if (on){ const hit = document.elementFromPoint(Math.min(innerWidth - 1, Math.max(0, r.left + r.width / 2)), Math.min(innerHeight - 1, Math.max(0, r.top + r.height / 2))); if (!hit || !(hit === el || el.contains(hit) || hit.contains(el))) continue; }
      else if (!(scrollable() || inScroller(el)) || !(el.checkVisibility ? el.checkVisibility({ opacityProperty: true, visibilityProperty: true }) : true)) continue;
      out.push(el); }
    return out;
  }
  function setFocus(el){ if (focus === el) return; if (focus) focus.classList.remove('gp-focus'); focus = el; if (el){ el.classList.add('gp-focus'); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } }
  function firstFocus(list){ return list.find(e => /startBtn|resumeBtn|retryBtn/.test(e.id)) || list.find(e => e.classList.contains('sel')) || list[0]; }
  function move(list, dir){
    if (!focus || !list.includes(focus)){ setFocus(firstFocus(list)); return; }
    const a = focus.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2; let best = null, bs = 1e9;
    for (const el of list){ if (el === focus) continue; const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
      const main = dir === 'L' ? -dx : dir === 'R' ? dx : dir === 'U' ? -dy : dy, side = dir === 'L' || dir === 'R' ? Math.abs(dy) : Math.abs(dx); if (main < 4) continue; const s = main + side * 2.2; if (s < bs){ bs = s; best = el; } }
    if (best) setFocus(best);
  }

  // 右スティックで見回す (マウスを動かしたのと同じにする)
  function look(rx, ry, dt){
    if (rx || ry){
      if (!DRAGGAME && document.querySelector('canvas')){ const k = document.pointerLockElement ? .0022 : .005; document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, movementX: rx * LOOK_X * dt / k, movementY: ry * LOOK_Y * dt / k, buttons: document.pointerLockElement ? 0 : 1, clientX: vx, clientY: vy, view: window })); }
      else if (DRAGGAME){ if (!dragOn){ dragOn = true; vx = innerWidth / 2; vy = innerHeight / 2; cv().dispatchEvent(new MouseEvent('mousedown', { bubbles: true, button: 0, buttons: 1, clientX: vx, clientY: vy })); } vx += rx * LOOK_X * dt / .005; vy += ry * LOOK_Y * dt / .005; dispatchEvent(new MouseEvent('mousemove', { bubbles: true, buttons: 1, clientX: vx, clientY: vy })); }
      else { vx = Math.min(innerWidth, Math.max(0, vx + rx * 700 * dt)); vy = Math.min(innerHeight, Math.max(0, vy + ry * 500 * dt)); dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: vx, clientY: vy })); }
    } else if (dragOn) endDrag();
  }
  function loop(){ requestAnimationFrame(loop); step(performance.now()); }
  setInterval(() => { if (performance.now() - last > 120) step(performance.now()); }, 33);   /* 画面が隠れていても止まらないように */
  function step(now){
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (toastT > 0 && (toastT -= dt) <= 0) $t.style.opacity = 0;
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; const gp = pads[0];
    if (!gp){ if (Object.values(held).some(Boolean)) releaseAll(); $h.style.display = 'none'; if (focus){ focus.classList.remove('gp-focus'); focus = null; } return; }
    const raw = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > .5)); for (const i in blocked) if (!raw(i)) delete blocked[i]; const B = i => raw(i) && !blocked[i], ax = i => { const v = gp.axes[i] || 0; return Math.abs(v) < DEAD ? 0 : v; };
    const now_ = gp.buttons.map((b, i) => B(i)), was = prev, down = i => now_[i] && !was[i]; prev = now_;
    const lx = ax(0), ly = ax(1), rx = ax(2), ry = ax(3);
    if (now_.some(Boolean) || lx || ly || rx || ry) startUsing();
    if (helpT > 0) helpT -= dt;
    const list = clickables(), menu = list.length > 0;
    $h.style.display = used && (menu || helpT > 0) ? 'block' : 'none';
    // ＋ はいつでもポーズ (マウスが閉じこめられていたら外す。外れるとゲームがポーズになる)
    if (down(9)){ if (document.pointerLockElement) document.exitPointerLock(); else tap('KeyP'); }

    if (menu !== wasMenu){ wasMenu = menu; gp.buttons.forEach((b, i) => { if (raw(i)) blocked[i] = true; }); }   /* メニューとゲームが切りかわったら、押しっぱなしのボタンは一度はなすまで効かない */
    if (menu){
      for (const c in held) if (held[c]) key(c, false); if (zrOn){ zrOn = false; mouse('mouseup', 0); }
      if (!focus || !list.includes(focus)) setFocus(firstFocus(list));
      const dir = B(12) || ly < -STICK ? 'U' : B(13) || ly > STICK ? 'D' : B(14) || lx < -STICK ? 'L' : B(15) || lx > STICK ? 'R' : '';
      if (dir && (dir !== navHold || (navT -= dt) <= 0)){ move(list, dir); navT = dir !== navHold ? .38 : .14; } navHold = dir;
      if (down(1) && focus) focus.click();
      if (down(0)){ const back = list.find(e => /もどる|戻る|とじる|閉じる|再開|キャンセル/.test(e.textContent)); if (back) back.click(); }
      if (ry && scrollable()) scrollBy(0, ry * 900 * dt);
      else if (document.querySelector('canvas')) look(rx, ry, dt);   /* ボタンが出ていても、右スティックで見回せる */
      if (down(8)) tap('KeyM');
      return;
    }
    if (focus){ focus.classList.remove('gp-focus'); focus = null; } navHold = '';

    // ---------- ゲーム中 ----------
    key('KeyW', ly < -STICK); key('KeyS', ly > STICK); key('KeyA', lx < -STICK); key('KeyD', lx > STICK);
    key('ShiftLeft', B(6) || B(10));
    key('Space', B(0)); key('KeyE', B(1)); key('KeyQ', B(2)); key('KeyC', B(3)); key('KeyR', B(4)); key('KeyF', B(5)); key('KeyM', B(8));
    key('Digit1', B(14)); key('Digit2', B(12)); key('Digit3', B(15)); key('Enter', B(13));
    if (B(7) && !zrOn) mouse('mousedown', 0); if (!B(7) && zrOn){ mouse('mouseup', 0); mouse('click', 0); } zrOn = B(7);
    look(rx, ry, dt);
  }
  requestAnimationFrame(loop);
})();
</script>
